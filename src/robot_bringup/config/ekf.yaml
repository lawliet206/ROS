# robot_localization EKF 配置 — 融合编码器里程计 + IMU
# 安装: sudo apt install ros-noetic-robot-localization

frequency: 30

silent_tf_failure: false
two_d_mode: true

# 发布 odom → base_footprint TF (ESP32 的 rosserial 不发布 TF)
publish_tf: true

odom_frame: odom
base_link_frame: base_footprint
world_frame: odom

# --- 里程计输入 ---
odom0: /odom
odom0_config:
  [true,  false, false,    # x, y, z (差速车 y 不可移动, false 降噪声)
   false, false, true,     # roll, pitch, yaw
   true,  false, false,    # vx, vy, vz
   false, false, true,     # vroll, vpitch, vyaw
   false, false, false]    # ax, ay, az

# --- IMU 输入 (MPU6050: 固件已旋转到 base_link 帧, X=前进, Y=左, Z=上) ---
imu0: /imu
imu0_config:
  [false, false, false,    # x, y, z
   false, false, false,    # roll, pitch, yaw
   false, false, false,    # vx, vy, vz (线速度, IMU 不测)
   false, false, true,     # vroll, vpitch, vyaw (vyaw=偏航角速度)
    true, false, false]    # ax, ay, az (ax=前进加速度)

# 差分模式下的位姿预测
differential: false

# 传感器超时 (秒)
odom0_differential: false
imu0_differential: false
odom0_queue_size: 10
imu0_queue_size: 10
